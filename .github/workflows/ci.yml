name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kjbn
          POSTGRES_PASSWORD: kjbn_ci_only
          POSTGRES_DB: kjbn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kjbn -d kjbn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The API tests wipe this database on every run; it exists only for this job.
      TEST_DATABASE_URL: postgresql+psycopg://kjbn:kjbn_ci_only@localhost:5432/kjbn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Business-rules layer needs at least 80% coverage
        run: coverage report --include="app/domain/*" --fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
